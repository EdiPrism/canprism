name: Feature Request
description: Suggest an offline CAN / CAN FD, SAE J1939, AUTOSAR ARXML, or firmware codegen enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Engineering Workflow / Problem Statement
      placeholder: Describe the embedded, HIL, ADAS, or vehicle networking workflow this feature would streamline (100% offline).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Capability
    validations:
      required: true
